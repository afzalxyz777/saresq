<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SaResQ">
  <!-- The mark is the thing the payload actually sees: a body-heat bloom on a
       cold background, sitting inside the detector's box. Thermal finds it,
       RGB confirms it: the whole architecture in one glyph. Palette is
       INFERNO, the same map the live thermal panel uses, so the icon and the
       screen are recognisably one system. -->
  <defs>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF3DA"/>
      <stop offset="22%"  stop-color="#FFC16B"/>
      <stop offset="45%"  stop-color="#F3722C"/>
      <stop offset="70%"  stop-color="#9B2263"/>
      <stop offset="88%"  stop-color="#3B0F52"/>
      <stop offset="100%" stop-color="#3B0F52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132029"/>
      <stop offset="100%" stop-color="#0A1218"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="27" fill="url(#plate)"/>
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="26.4" fill="none"
        stroke="#24343E" stroke-width="1.5"/>

  <!-- scan arcs: the survey sweep -->
  <g fill="none" stroke="#2FA8C9" stroke-linecap="round" opacity=".5">
    <path d="M22 64a42 42 0 0 1 12-29.7" stroke-width="2.4"/>
    <path d="M106 64a42 42 0 0 1-12 29.7" stroke-width="2.4"/>
  </g>

  <circle cx="64" cy="62" r="34" fill="url(#bloom)"/>

  <!-- detector box: the RGB confirmation -->
  <g fill="none" stroke="#5BE39B" stroke-width="3.4" stroke-linecap="round">
    <path d="M40 46v-7a3 3 0 0 1 3-3h7"/>
    <path d="M88 46v-7a3 3 0 0 0-3-3h-7"/>
    <path d="M40 78v7a3 3 0 0 0 3 3h7"/>
    <path d="M88 78v7a3 3 0 0 0-3 3h-7"/>
  </g>

  <circle cx="64" cy="62" r="5.2" fill="#FFF6E6"/>
</svg>
