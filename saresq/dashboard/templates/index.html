<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SaResQ</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; background: #e8e8e0; }
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 10px 14px; border-radius: 6px;
      font-family: -apple-system, sans-serif; font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3); max-width: 260px;
    }
    #panel h3 { margin: 0 0 6px 0; font-size: 14px; }
    .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    #status { position: absolute; bottom: 10px; left: 10px; z-index: 1000;
      background: white; padding: 4px 10px; border-radius: 4px; font-family: sans-serif; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h3>SaResQ live targets</h3>
    <div><span class="legend-dot" style="background:#d62728"></span>HIGH -- dispatch</div>
    <div><span class="legend-dot" style="background:#ff9f1c"></span>MEDIUM -- investigate</div>
    <div><span class="legend-dot" style="background:#888888"></span>LOW -- deprioritised</div>
    <div><span class="legend-dot" style="background:#7b2cbf"></span>Hazard</div>
    <div style="margin-top:6px;color:#888">no basemap tiles (offline demo)</div>
  </div>
  <div id="status">connecting...</div>

  <script src="/static/leaflet/leaflet.js"></script>
  <script>
    // Leaflet's default marker icons reference images via a relative CDN
    // path baked into the CSS; point them at our vendored copies instead
    // so this page works with zero internet (Section 13.2/13.3).
    delete L.Icon.Default.prototype._getIconUrl;
    L.Icon.Default.mergeOptions({
      iconRetinaUrl: '/static/leaflet/images/marker-icon-2x.png',
      iconUrl: '/static/leaflet/images/marker-icon.png',
      shadowUrl: '/static/leaflet/images/marker-shadow.png',
    });

    const CLASS_COLORS = {HIGH: '#d62728', MEDIUM: '#ff9f1c', LOW: '#888888'};
    const map = L.map('map').setView([22.5726, 88.3639], 16);
    const markers = L.layerGroup().addTo(map);

    function popupHtml(target, passes) {
      const rows = passes.map(p =>
        `<tr><td>${p.pass_id}</td><td>${p.alt_band ?? ''}</td><td>${(p.p_pass ?? 0).toFixed(2)}</td>
         <td>${(p.z_peak_max ?? 0).toFixed(1)}</td><td>${(p.p_rgb_max ?? 0).toFixed(2)}</td></tr>`
      ).join('');
      const thumb = target.thumb_path ? `<img src="/thumbs/${target.thumb_path}" style="max-width:200px;display:block;margin-bottom:6px">` : '';
      return `${thumb}<b>Target ${target.target_id}</b> -- ${target.class ?? '?'} (P=${(target.p_final ?? 0).toFixed(2)})<br>
        decision: ${target.decision ?? '?'}, ${target.n_passes ?? 0} pass(es)<br>
        <table style="font-size:11px;border-collapse:collapse;margin-top:4px">
          <tr><th>pass</th><th>band</th><th>p</th><th>z_peak</th><th>p_rgb</th></tr>${rows}
        </table>`;
    }

    async function refresh() {
      try {
        const [targets, hazards] = await Promise.all([
          fetch('/api/targets').then(r => r.json()),
          fetch('/api/hazards').then(r => r.json()),
        ]);
        markers.clearLayers();
        for (const t of targets) {
          if (t.lat == null || t.lon == null) continue;
          const color = CLASS_COLORS[t.class] || '#3388ff';
          const m = L.circleMarker([t.lat, t.lon], {
            radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2,
          });
          m.on('click', async () => {
            const passes = await fetch(`/api/targets/${t.target_id}/passes`).then(r => r.json());
            m.bindPopup(popupHtml(t, passes)).openPopup();
          });
          markers.addLayer(m);
        }
        for (const h of hazards) {
          if (h.lat == null || h.lon == null) continue;
          L.circleMarker([h.lat, h.lon], {
            radius: 7, color: '#7b2cbf', fillColor: '#7b2cbf', fillOpacity: 0.7,
          }).bindPopup(`Hazard: ${h.class} (p=${(h.p ?? 0).toFixed(2)})`).addTo(markers);
        }
        document.getElementById('status').textContent =
          `${targets.length} target(s), ${hazards.length} hazard(s) -- updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('status').textContent = 'offline / no data yet';
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
